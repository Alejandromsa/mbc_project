name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres real para las pruebas de integración de la API (apps/api)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: processiq_pruebas
          POSTGRES_USER: processiq
          POSTGRES_PASSWORD: processiq
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U processiq -d processiq_pruebas"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://processiq:processiq@localhost:5440/processiq_pruebas
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Fronteras entre paquetes
        run: pnpm fronteras

      - name: Tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Pruebas unitarias
        run: pnpm test

      - name: Navegador para las pruebas de fidelidad
        run: pnpm --filter @processiq/pruebas-fidelidad exec playwright install --with-deps chromium

      - name: Fidelidad frente al MVP 3.8.9
        run: pnpm fidelidad

      - name: Resultados de fidelidad (si fallo)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fidelidad-resultados
          path: |
            pruebas/fidelidad/resultados/
            pruebas/fidelidad/playwright-report/
          retention-days: 14

      - name: Imagenes Docker
        run: docker compose build
        env:
          DOMINIO: ci.invalid
          POSTGRES_PASSWORD: solo-para-construir
